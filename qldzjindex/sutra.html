<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>乾隆大藏经图片浏览</title>
  <style>
    /* 样式内容与之前相同 */
  </style>
</head>
<body>

<div class="container">
  <img id="image" src="" alt="Image" />
  <div class="navigation">
    <button id="prevBtn"> </button>
    <button id="nextBtn"> </button>
  </div>
</div>

<script>
  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return pair[1];
    }
    return false;
  }

  const startParam = getQueryVariable('start'); // e.g. "001165"
  const endParam = getQueryVariable('end');     // e.g. "014084"

  // 提取册号和页号
  const startVol = startParam ? startParam.slice(0, 3) : '001';
  const startPage = startParam ? startParam.slice(3, 6) : '001';
  const endVol = endParam ? endParam.slice(0, 3) : startVol;
  const endPage = endParam ? endParam.slice(3, 6) : '999';

  let currentPage = startPage;
  let currentVol = startVol;

  function changeImage(direction) {
    const page = parseInt(currentPage, 10) + direction;
    const vol = parseInt(currentVol, 10);

    if (direction > 0) {
      if (page >= 999) {
        currentPage = '001';
        currentVol = (vol + 1).toString().padStart(3, '0');
      } else {
        currentPage = (page + 1).toString().padStart(3, '0');
      }
    } else {
      if (page <= 1) {
        currentPage = '999';
        currentVol = (vol - 1).toString().padStart(3, '0');
      } else {
        currentPage = (page - 1).toString().padStart(3, '0');
      }
    }

    document.getElementById('image').src = `/qldzj/${currentVol}/${currentPage}.png`;

    updateButtonState();
    positionButtons();
  }

  function updateButtonState() {
    const isStart = currentVol === startVol && currentPage === startPage;
    const isEnd = currentVol === endVol && currentPage === endPage;
    document.getElementById('prevBtn').disabled = isStart;
    document.getElementById('nextBtn').disabled = isEnd;
  }

  function positionButtons() {
    const img = document.getElementById('image');
    const rect = img.getBoundingClientRect();

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    prevBtn.style.left = `${rect.left - prevBtn.offsetWidth / 2}px`;
    prevBtn.style.top = `${window.scrollY + rect.top + rect.height / 2}px`;

    nextBtn.style.left = `${rect.right - nextBtn.offsetWidth / 2}px`;
    nextBtn.style.top = `${window.scrollY + rect.top + rect.height / 2}px`;
  }

  window.onload = () => {
    document.getElementById('image').src = `/qldzj/${currentVol}/${currentPage}.png`;
    positionButtons();
    updateButtonState();
  };

  window.onresize = () => {
    positionButtons();
  };

  document.getElementById('prevBtn').addEventListener('click', () => changeImage(-1));
  document.getElementById('nextBtn').addEventListener('click', () => changeImage(1));

  const image = document.getElementById('image');
  const buttons = document.querySelectorAll('.navigation button');

  image.addEventListener('mouseenter', () => {
    buttons.forEach(button => button.classList.add('hidden-button'));
  });

  image.addEventListener('mouseleave', () => {
    buttons.forEach(button => button.classList.remove('hidden-button'));
  });
</script>

</body>
</html>
