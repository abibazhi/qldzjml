<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>乾隆大藏经图片浏览</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            background-color: white;
        }
        .navigation {
            margin-top: 10px;
        }
        .navigation button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .navigation button:hover {
            background-color: #0056b3;
        }
        .navigation button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <img id="image" src="https://daxumi.cn/qldzj/163/118.png" alt="Image">
    <div class="navigation">
        <button id="prevBtn" onclick="changeImage(-1)">上一页</button>
        <button id="nextBtn" onclick="changeImage(1)">下一页</button>
    </div>
</div>

<script>
    const minPage = 118;
    const maxPage = 175;
    let currentPage = 118;

    function changeImage(direction) {
        currentPage += direction;
        if (currentPage > maxPage) {
            currentPage = maxPage;
        } else if (currentPage < minPage) {
            currentPage = minPage;
        }

        document.getElementById('image').src = `https://daxumi.cn/qldzj/163/${currentPage}.png`;

        // 更新按钮状态
        document.getElementById('prevBtn').disabled = currentPage === minPage;
        document.getElementById('nextBtn').disabled = currentPage === maxPage;
    }

    // 初始化按钮状态
    document.getElementById('prevBtn').disabled = currentPage === minPage;
    document.getElementById('nextBtn').disabled = currentPage === maxPage;
</script>

</body>
</html>
