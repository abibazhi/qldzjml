<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>乾隆大藏经图片浏览</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #f0f0f0;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border: 1px solid #ddd;
      background-color: white;
    }

    .navigation button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007BFF;
      color: white;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .navigation button:hover {
      background-color: #0056b3;
    }

    .navigation button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <img id="image" src="https://daxumi.cn/qldzj/163/118.png" alt="Image" />
  <div class="navigation">
    <button id="prevBtn">上一页</button>
    <button id="nextBtn">下一页</button>
  </div>
</div>

<script>
  const minPage = 118;
  const maxPage = 175;
  let currentPage = 118;

  function changeImage(direction) {
    currentPage += direction;
    if (currentPage > maxPage) currentPage = maxPage;
    else if (currentPage < minPage) currentPage = minPage;

    document.getElementById('image').src = `https://daxumi.cn/qldzj/163/${currentPage}.png`;

    updateButtonState();
    positionButtons(); // 更新按钮位置
  }

  function updateButtonState() {
    document.getElementById('prevBtn').disabled = currentPage === minPage;
    document.getElementById('nextBtn').disabled = currentPage === maxPage;
  }

  function positionButtons() {
    const img = document.getElementById('image');
    const rect = img.getBoundingClientRect();

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 上一页按钮：右边贴着图片左边
    prevBtn.style.left = `${rect.left}px`;
    prevBtn.style.top = `${window.scrollY + rect.top + rect.height / 2}px`;
    prevBtn.style.transform = `translateY(-50%) translateX(-100%)`;

    // 下一页按钮：左边贴着图片右边
    nextBtn.style.left = `${rect.right}px`;
    nextBtn.style.top = `${window.scrollY + rect.top + rect.height / 2}px`;
    nextBtn.style.transform = `translateY(-50%)`;
  }

  // 页面加载完成后定位一次
  window.onload = () => {
    positionButtons();
    updateButtonState(); // 初始化按钮状态
  };

  // 监听窗口变化时重新定位按钮
  window.onresize = () => {
    positionButtons();
  };

  // 绑定按钮点击事件
  document.getElementById('prevBtn').addEventListener('click', () => changeImage(-1));
  document.getElementById('nextBtn').addEventListener('click', () => changeImage(1));
</script>

</body>
</html>
